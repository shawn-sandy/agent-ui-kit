<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert - agent-ui-kit demo</title>
<style>
/* Page chrome for the demo only. Not part of the component. */
body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; color: #111827; background: #ffffff; }
h1 { font-size: 1.25rem; }
h2 { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; color: #374151; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-block-end: 1rem; }
.regions { display: grid; gap: 0.75rem; }
button { font: inherit; padding: 0.5rem 0.875rem; border-radius: 0.375rem; border: 1px solid #6b7280; background: #ffffff; color: #1f2937; cursor: pointer; min-height: 2.75rem; }
button:focus-visible { outline: 3px solid #111827; outline-offset: 2px; }

/* Generated from alert.md by scripts/build-demos.mjs. Edit the reference, not this. */
.auk-alert {
  display: flex;
  align-items: flex-start;
  gap: var(--auk-alert-gap, 0.625rem);
  padding-block: var(--auk-alert-padding-block, 0.75rem);
  padding-inline: var(--auk-alert-padding-inline, 1rem);
  border: var(--auk-alert-border-width, 1px) solid var(--auk-alert-border-color, #1e3a8a);
  border-radius: var(--auk-alert-radius, 0.375rem);
  font-family: var(--auk-alert-font-family, inherit);
  font-size: var(--auk-alert-font-size, 1rem);
  line-height: var(--auk-alert-line-height, 1.5);
  color: var(--auk-alert-color, #1e3a8a);
  background-color: var(--auk-alert-bg, #dbeafe);
}

.auk-alert:empty,
.auk-alert:not(:has([data-part="message"]:not(:empty))) {
  display: none;
}

.auk-alert[data-variant="success"] {
  color: var(--auk-alert-success-color, #14532d);
  background-color: var(--auk-alert-success-bg, #dcfce7);
  border-color: var(--auk-alert-success-border-color, #14532d);
}

.auk-alert[data-variant="warning"] {
  color: var(--auk-alert-warning-color, #78350f);
  background-color: var(--auk-alert-warning-bg, #fef3c7);
  border-color: var(--auk-alert-warning-border-color, #78350f);
}

.auk-alert[data-variant="error"] {
  color: var(--auk-alert-error-color, #b91c1c);
  background-color: var(--auk-alert-error-bg, #fee2e2);
  border-color: var(--auk-alert-error-border-color, #b91c1c);
}

.auk-alert [data-part="icon"] {
  flex: none;
  font-size: var(--auk-alert-icon-size, 1.125rem);
  line-height: var(--auk-alert-line-height, 1.5);
}

.auk-alert [data-part="severity"] {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>
<h1>Alert</h1>

<section>
  <h2>Announce something</h2>
  <div class="row">
    <button type="button" data-fill="error">Fail the save</button>
    <button type="button" data-fill="warning">Warn about the quota</button>
    <button type="button" data-fill="success">Finish the upload</button>
    <button type="button" data-fill="info">Mention the maintenance window</button>
    <button type="button" id="clear">Clear all</button>
  </div>
</section>

<section>
  <h2>Live regions - present at load, empty</h2>
  <div class="regions">
    <div class="auk-alert" data-variant="error" role="alert" aria-live="assertive" aria-atomic="true" id="alert-error">
      <span data-part="icon" aria-hidden="true">&#9888;</span>
      <span data-part="severity">Error:</span>
      <span data-part="message"></span>
    </div>

    <div class="auk-alert" data-variant="warning" role="status" aria-live="polite" aria-atomic="true" id="alert-warning">
      <span data-part="icon" aria-hidden="true">&#9888;</span>
      <span data-part="severity">Warning:</span>
      <span data-part="message"></span>
    </div>

    <div class="auk-alert" data-variant="success" role="status" aria-live="polite" aria-atomic="true" id="alert-success">
      <span data-part="icon" aria-hidden="true">&#10003;</span>
      <span data-part="severity">Success:</span>
      <span data-part="message"></span>
    </div>

    <div class="auk-alert" data-variant="info" role="status" aria-live="polite" aria-atomic="true" id="alert-info">
      <span data-part="icon" aria-hidden="true">&#8505;</span>
      <span data-part="severity">Information:</span>
      <span data-part="message"></span>
    </div>
  </div>
</section>

<script>
// Demo wiring. Note what it does NOT do: it never creates a region, it only writes
// into one that was already in the document.
var TEXT = {
  error: 'Could not save changes. The server rejected the request.',
  warning: 'Storage is at 92 percent of the quota.',
  success: 'Upload finished. 14 files added.',
  info: 'Scheduled maintenance starts at 02:00 UTC.'
};
document.querySelectorAll('[data-fill]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var variant = btn.getAttribute('data-fill');
    var region = document.getElementById('alert-' + variant);
    region.querySelector('[data-part="message"]').textContent = TEXT[variant];
  });
});
document.getElementById('clear').addEventListener('click', function () {
  document.querySelectorAll('.auk-alert [data-part="message"]').forEach(function (el) {
    el.textContent = '';
  });
});
</script>
</body>
</html>
