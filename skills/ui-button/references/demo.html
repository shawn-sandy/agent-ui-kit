<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button - agent-ui-skills demo</title>
<style>
/* Page chrome for the demo only. Not part of the component. */
body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; color: #111827; background: #ffffff; }
h1 { font-size: 1.25rem; }
section { margin-block: 1.5rem; }
h2 { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; color: #374151; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
#log { font-family: ui-monospace, monospace; background: #f3f4f6; color: #111827; padding: 0.5rem 0.75rem; border-radius: 0.25rem; }

/* Generated from ui-button.md by scripts/build-demos.mjs. Edit the reference, not this. */
.auk-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--auk-button-gap, 0.5rem);
  min-block-size: var(--auk-button-min-size, 2.75rem);
  min-inline-size: var(--auk-button-min-size, 2.75rem);
  padding-block: var(--auk-button-padding-block, 0.625rem);
  padding-inline: var(--auk-button-padding-inline, 1rem);
  border: var(--auk-button-border-width, 1px) solid var(--auk-button-border-color, transparent);
  border-radius: var(--auk-button-radius, 0.375rem);
  font-family: var(--auk-button-font-family, inherit);
  font-size: var(--auk-button-font-size, 1rem);
  font-weight: var(--auk-button-font-weight, 600);
  line-height: var(--auk-button-line-height, 1.25);
  color: var(--auk-button-color, #ffffff);
  background-color: var(--auk-button-bg, #1a56db);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.auk-button[data-variant="secondary"] {
  color: var(--auk-button-secondary-color, #1f2937);
  background-color: var(--auk-button-secondary-bg, #ffffff);
  border-color: var(--auk-button-secondary-border-color, #6b7280);
}

.auk-button[data-variant="destructive"] {
  color: var(--auk-button-destructive-color, #ffffff);
  background-color: var(--auk-button-destructive-bg, #b91c1c);
}

.auk-button[data-icon-only] {
  padding-inline: var(--auk-button-icon-padding-inline, 0.625rem);
}

.auk-button:hover:not([aria-disabled="true"]) {
  filter: brightness(var(--auk-button-hover-brightness, 0.92));
}

.auk-button:focus-visible {
  outline: var(--auk-button-focus-width, 3px) solid var(--auk-button-focus-color, #111827);
  outline-offset: var(--auk-button-focus-offset, 2px);
}

.auk-button[aria-disabled="true"] {
  color: var(--auk-button-disabled-color, #ffffff);
  background-color: var(--auk-button-disabled-bg, #6b7280);
  border-color: var(--auk-button-disabled-border-color, transparent);
  cursor: not-allowed;
  pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  .auk-button {
    transition: filter var(--auk-button-transition-duration, 120ms) ease;
  }
}
</style>
</head>
<body>
<h1>Button</h1>

<section>
  <h2>Variants</h2>
  <div class="row">
    <button class="auk-button" type="button" data-variant="primary" id="primary">Save changes</button>
    <button class="auk-button" type="button" data-variant="secondary" id="secondary">Cancel</button>
    <button class="auk-button" type="button" data-variant="destructive" id="destructive">Delete account</button>
  </div>
</section>

<section>
  <h2>Unavailable</h2>
  <div class="row">
    <button class="auk-button" type="button" data-variant="primary" aria-disabled="true" id="unavailable">
      Saving...
    </button>
    <span>Reachable by Tab, but does nothing.</span>
  </div>
</section>

<section>
  <h2>Icon only</h2>
  <div class="row">
    <button class="auk-button" type="button" data-variant="secondary" data-icon-only aria-label="Close" id="iconOnly">
      <span data-part="icon" aria-hidden="true">&times;</span>
    </button>
  </div>
</section>

<section>
  <h2>Activations</h2>
  <p id="log" data-count="0">0</p>
</section>

<script>
// Demo wiring. The early return is the guard the reference requires of every
// handler attached to a button that can become unavailable.
var log = document.getElementById('log');
var count = 0;
document.querySelectorAll('.auk-button').forEach(function (el) {
  el.addEventListener('click', function () {
    if (el.getAttribute('aria-disabled') === 'true') return;
    count += 1;
    log.textContent = String(count);
    log.setAttribute('data-count', String(count));
  });
});
</script>
</body>
</html>
