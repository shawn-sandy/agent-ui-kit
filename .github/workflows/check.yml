name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # No step here runs an authenticated git command, so the checkout token has no
      # reason to be written into .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install --with-deps chromium

      # Gate 5 of scripts/check.sh needs the Claude Code CLI. Everything else runs
      # from the repo's own dependencies.
      - run: npm install -g @anthropic-ai/claude-code

      - run: bash scripts/check.sh --prove
