# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Quiet mode. CodeRabbit still reviews and still posts findings; what it stops doing
# is narrating. No status comment, no sequence diagrams, no changed-files table, no
# ASCII art. The high-level summary stays, collapsed.

reviews:
  profile: quiet
  review_status: false
  sequence_diagrams: false
  changed_files_summary: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false

  # Two trees are noise by construction, not by accident.
  path_filters:
    # Deliberately broken skills. check.sh --prove runs them to confirm each gate can
    # still fail, so every fault in here is load-bearing. They are not defects.
    - "!tests/fixtures/**"
    # Generated by scripts/build-demos.mjs from the sibling reference. A suggestion
    # applied here is overwritten on the next build.
    - "!skills/**/references/demo.html"
    - "!package-lock.json"

  # Without this a reviewer suggests things the portability gate then rejects.
  path_instructions:
    - path: "skills/**"
      instructions: >-
        This tree must load unchanged in both Claude Code and Codex. Never suggest a
        framework, preprocessor, package import, or install step. Never suggest
        ${CLAUDE_PLUGIN_ROOT} or the disable-model-invocation or hint frontmatter keys -
        all three are rejected by scripts/lint-portability.mjs. Nothing here may load an
        external resource. docs/component-spec.md is the authoring contract.

chat:
  art: false
