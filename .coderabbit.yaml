# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Quiet mode. CodeRabbit still reviews and still posts findings; what it stops doing
# is narrating. No status comment, no sequence diagrams, no changed-files table, no
# label or reviewer suggestions, no ASCII art. The high-level summary stays.

reviews:
  profile: quiet
  review_status: false
  sequence_diagrams: false
  changed_files_summary: false
  suggested_labels: false
  suggested_reviewers: false

  # Broken on purpose. check.sh --prove runs these fixtures to confirm each gate can
  # still fail, so every fault in here is load-bearing and none of it is a defect.
  # Lock files are excluded by CodeRabbit's own defaults and need no entry.
  path_filters:
    - "!tests/fixtures/**"

  path_instructions:
    # Without this a reviewer suggests things the portability gate then rejects.
    - path: "skills/**"
      instructions: >-
        This tree must load unchanged in both Claude Code and Codex. Never suggest a
        framework, preprocessor, package import, or install step - the words React,
        Vue, Svelte, Angular, Next.js, Tailwind, jQuery, styled-components, SCSS,
        Sass, LESS, Stylus and PostCSS are rejected anywhere in these files, prose
        included. Never suggest ${CLAUDE_PLUGIN_ROOT}, a Windows backslash path, or
        the disable-model-invocation or hint frontmatter keys. All of the above are
        enforced by scripts/lint-portability.mjs, which scans this tree only - files
        under .claude/ are outside it and these rules do not apply there. Nothing
        here may load an external resource. Descriptions must be third person and
        free of first- and second-person pronouns. docs/component-spec.md is the
        authoring contract and wins over any other document on conflict.
    # Only the marker-delimited style and script regions are generated; the markup,
    # page chrome and wiring around them are hand-written and worth reviewing.
    - path: "skills/**/references/demo.html"
      instructions: >-
        The regions delimited by the "Generated from <name>.md" marker comment are
        rewritten by scripts/build-demos.mjs from the sibling reference - a
        suggestion inside them is overwritten on the next build, so raise it against
        the reference instead. Everything outside those markers is hand-written:
        review the markup, page chrome and wiring normally.

chat:
  art: false
